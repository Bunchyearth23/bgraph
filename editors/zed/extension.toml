id = "bgraph"
name = "bgraph"
description = "Syntax highlighting and language server for the bgraph diagram DSL"
version = "0.1.0"
schema_version = 1
authors = ["Bunchyearth23"]
repository = "https://github.com/Bunchyearth23/bgraph"

# The grammar lives in this same repository, under tree-sitter-bgraph/.
# `rev` must be a real commit that contains the generated parser — run
# ./editors/zed/install.sh to point it at the current HEAD.
[grammars.bgraph]
repository = "https://github.com/Bunchyearth23/bgraph"
rev = "0b9327a480e767bbdc771f7ea2d00cdaa8590cfd"
path = "tree-sitter-bgraph"

[language_servers.bgraph-lsp]
name = "bgraph"
languages = ["bgraph"]
