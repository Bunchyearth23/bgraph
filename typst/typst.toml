# A Typst package manifest, so the module can be *installed* rather than only
# imported by relative path.
#
#   ~/.local/share/typst/packages/local/bgraph/0.1.0/
#
# and then `#import "@local/bgraph:0.1.0": diagram`. The release ships this
# directory as an archive shaped to unpack straight into that path (`W-139`).
#
# `exclude` keeps the build script and the example out of what a document
# consumer receives; `bgraph.wasm` is *not* excluded and is not in the
# repository either — the release puts it in, `./typst/build.sh` puts it there
# for a working copy.
[package]
name = "bgraph"
version = "0.1.0"
entrypoint = "bgraph.typ"
authors = ["Arnaud De Cafmeyer <adecafmeyer@duck.com>"]
license = "PolyForm-Noncommercial-1.0.0"
description = "Diagrams as text, where you decide the layout — the bgraph renderer as a Typst plugin."
repository = "https://github.com/Bunchyearth23/bgraph"
categories = ["visualization"]
exclude = ["build.sh", "example"]
