[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Stylable diagrams from a layout-first DSL — you place the boxes, it draws the SVG."
repository = "https://github.com/Bunchyearth23/bgraph"
readme = "README.md"
authors = ["Arnaud De Cafmeyer"]
# Proprietary, all rights reserved — not an SPDX licence, so the file is
# named rather than identified.
license-file = "LICENSE"

# Not published, and that is a standing decision (D-020), not an oversight.
# The licence is proprietary, so a public registry is the wrong place for it
# regardless; and a version on crates.io cannot be withdrawn, only yanked.
# `cargo publish` refuses outright on this line, so the refusal is
# load-bearing rather than a comment someone can miss.
publish = false

[lib]
name = "bgraph"
path = "src/lib.rs"

[[bin]]
name = "bgraph"
path = "src/main.rs"

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"

[features]
# One feature per archetype, so a program embedding `bgraph` for a single
# chart does not compile the other fifteen. `free` is not a feature: it is the
# language itself, and a file that declares no `type` is a free graph.
#
# An archetype that is not compiled in is *unknown*, not broken: `check` says
# so and lists what is available. Silently accepting `type pie` and then
# failing to draw it would be the worse trade.
default = ["all-archetypes"]
all-archetypes = [
    "pie",
    "packet",
    "treemap",
    "quadrant",
    "wave",
    "sankey",
    "bar",
    "xy",
    "sequence",
    "gantt",
    "timeline",
    "block",
    "er",
    "class",
    "state",
]
pie = []
packet = []
treemap = []
quadrant = []
wave = []
sankey = []
bar = []
xy = []
sequence = []
gantt = []
timeline = []
block = []
er = []
class = []
state = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"
