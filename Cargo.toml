[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stylable diagrams from a layout-first DSL — you place the boxes, it draws the SVG."
repository = "https://github.com/Bunchyearth23/bgraph"
readme = "README.md"
authors = ["Arnaud De Cafmeyer"]
license-file = "LICENSE"

publish = false

[lib]
name = "bgraph"
path = "src/lib.rs"
# `rlib` is what the binaries and other crates link against; `cdylib` is what
# a wasm build needs to emit a module at all. Both, so one manifest serves
# both without a second profile to keep in step.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bgraph"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"
required-features = ["cli"]

[features]
default = ["cli", "all-archetypes", "pdf", "json", "csv", "completions"]
all-archetypes = [
    "pie",
    "packet",
    "bytefield",
    "treemap",
    "quadrant",
    "wave",
    "sankey",
    "bar",
    "xy",
    "sequence",
    "gantt",
    "timeline",
    "block",
    "er",
    "requirements",
    "kanban",
    "journey",
    "radar",
    "rack",
    "network",
    "venn",
    "harness",
    "gitgraph",
    "orgchart",
    "mindmap",
    "treeview",
    "class",
    "state",
]
pie = []
packet = []
bytefield = []
treemap = []
quadrant = []
wave = []
sankey = []
bar = []
xy = []
sequence = []
gantt = []
timeline = []
block = []
er = []
requirements = []
kanban = []
journey = []
radar = []
rack = []
network = []
venn = []
harness = []
gitgraph = []
orgchart = []
mindmap = []
treeview = []
class = []
state = []

# PDF is vector output, so it needs no rasteriser and no dependency
# (`D-027`). On by default; switch it off and the writer is not compiled.
pdf = []

# Reading bindings from JSON. `serde_json` is already here for the language
# server's wire format, so this gates code rather than a dependency.
json = []

# Reading rows from CSV — one header line, one row per repetition. Hand-rolled
# for the same reason as everything else here: the dialect is twenty lines.
csv = []

# A native window. **Off by default, and it has to be.** This crate keeps five
# dependencies on purpose — the SVG writer, the HTTP preview and the PDF writer
# are all hand-rolled to avoid a tree — and a window plus an SVG rasteriser is
# seventy-eight more in the build graph. That is a fair price for someone who
# wants
# it and an unfair one for someone embedding the library, so it is opt-in:
#
#   cargo build --features window
window = ["dep:minifb", "png"]

# PNG output. Off by default for the same reason the window is: this is the
# one thing in the crate that cannot be hand-rolled — a raster means zlib, and
# a rasteriser means text shaping, curve flattening and antialiasing — so it
# is the one place a dependency is the honest answer rather than a shortcut.
#
# Its own feature rather than part of `window`, because someone rendering
# images in CI has no display and wants no windowing library. The implication
# runs one way: a window already needs the rasteriser, so `window` turns this
# on and not the reverse.
png = ["dep:resvg", "dep:tiny-skia"]

# Shell completions and a man page, generated from the same `Cli` struct clap
# parses with — so they cannot describe flags the binary does not have.
#
# On by default, unlike `window`, because the cost is honest: `clap_complete`
# has no dependency beyond the `clap` already here, and `clap_mangen` brings
# one small crate. Both are binary-only, so the library a caller embeds is
# untouched — and `--no-default-features`, which CI builds, still resolves to
# the five this crate promises.
completions = ["cli", "dep:clap_complete", "dep:clap_mangen"]

# The two binaries. Optional so a *library* consumer — and the wasm build in
# particular — does not compile an argument parser it will never call. The
# binaries declare it in `required-features`, so `cargo build` still builds
# them and `cargo build --no-default-features` builds only the library.
cli = ["dep:clap"]

# The wasm entry points: a handful of `extern "C"` functions over a linear
# memory, hand-rolled for the same reason everything else here is. No
# `wasm-bindgen`, which would be a dependency and a build step for four
# functions whose whole job is to move bytes.
wasm = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"], optional = true }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"

# Only with `--features completions`, and binary-only either way.
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }

# Only with `--features window`; see the note above. `minifb` is a window and a
# pixel buffer in one crate, which is why this costs 128 packages where
# `winit` + `softbuffer` cost 249 — the windowing is the expensive half, not
# the renderer: 30 crates become 108, where `winit` + `softbuffer` would make
# them 249. `resvg` drops what a bgraph diagram never uses — it emits no
# embedded rasters and no gzipped SVG.
minifb = { version = "0.28", optional = true }
resvg = { version = "0.48", optional = true, default-features = false, features = [
    "text",
    "system-fonts",
] }
tiny-skia = { version = "0.12", optional = true }
