[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stylable diagrams from a layout-first DSL — you place the boxes, it draws the SVG."
repository = "https://github.com/Bunchyearth23/bgraph"
readme = "README.md"
authors = ["Bunchyearth23"]
# One file, written for this project (`D-038`): noncommercial use, builds may
# be passed on unchanged, the source is confidential, no changes. A
# `LicenseRef-` identifier because it is not on anyone's list and claiming an
# id that does not exist is worse than admitting there is none.
# `publish = false` stays: crates.io is a second channel and nobody has
# decided on it.
license = "LicenseRef-bgraph-noncommercial-1.0"

publish = false

[lib]
name = "bgraph"
path = "src/lib.rs"
# `rlib` is what the binaries and other crates link against; `cdylib` is what
# a wasm build needs to emit a module at all. Both, so one manifest serves
# both without a second profile to keep in step.
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "pipeline"
harness = false

[[bin]]
name = "bgraph"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"
required-features = ["cli"]

[features]
default = ["cli", "all-archetypes", "pdf", "json", "csv", "completions"]
all-archetypes = [
    "pie",
    "packet",
    "bytefield",
    "treemap",
    "quadrant",
    "wave",
    "sankey",
    "bar",
    "xy",
    "sequence",
    "gantt",
    "timeline",
    "block",
    "er",
    "requirements",
    "kanban",
    "journey",
    "radar",
    "rack",
    "network",
    "venn",
    "harness",
    "gitgraph",
    "orgchart",
    "mindmap",
    "treeview",
    "class",
    "state",
    "bpmn",
]
pie = []
packet = []
bytefield = []
treemap = []
quadrant = []
wave = []
sankey = []
bar = []
xy = []
sequence = []
gantt = []
timeline = []
block = []
er = []
requirements = []
kanban = []
journey = []
radar = []
rack = []
network = []
venn = []
harness = []
gitgraph = []
orgchart = []
mindmap = []
treeview = []
class = []
state = []
bpmn = []

# PDF is vector output, so it needs no rasteriser and no dependency
# (`D-027`). On by default; switch it off and the writer is not compiled.
pdf = []

# Reading bindings from JSON. `serde_json` is already here for the language
# server's wire format, so this gates code rather than a dependency.
json = []

# Reading rows from CSV — one header line, one row per repetition. Hand-rolled
# for the same reason as everything else here: the dialect is twenty lines.
csv = []

# PNG output. Off by default: this is the one thing in the crate that cannot
# be hand-rolled — a raster means zlib, and a rasteriser means text shaping,
# curve flattening and antialiasing — so it is the one place a dependency is
# the honest answer rather than a shortcut. Someone rendering images in a
# build asks for it; nobody else pays for it.
#
# There was a `window` feature in front of this once, a native viewer on
# `minifb`. It is gone (`W-136`): a browser is on every machine this runs on,
# it works the same over ssh and on a second screen, and it cost seventy-eight
# dependencies to say the same thing worse than `bgraph watch` already does.
png = ["dep:resvg", "dep:tiny-skia"]

# Shell completions and a man page, generated from the same `Cli` struct clap
# parses with — so they cannot describe flags the binary does not have.
#
# On by default, unlike `window`, because the cost is honest: `clap_complete`
# has no dependency beyond the `clap` already here, and `clap_mangen` brings
# one small crate. Both are binary-only, so the library a caller embeds is
# untouched — and `--no-default-features`, which CI builds, still resolves to
# the five this crate promises.
completions = ["cli", "dep:clap_complete", "dep:clap_mangen"]

# The two binaries. Optional so a *library* consumer — and the wasm build in
# particular — does not compile an argument parser it will never call. The
# binaries declare it in `required-features`, so `cargo build` still builds
# them and `cargo build --no-default-features` builds only the library.
cli = ["dep:clap"]

# The wasm entry points: a handful of `extern "C"` functions over a linear
# memory, hand-rolled for the same reason everything else here is. No
# `wasm-bindgen`, which would be a dependency and a build step for four
# functions whose whole job is to move bytes.
wasm = []

# Typst's own plugin protocol, which is a different shape: the host writes the
# arguments into memory itself and takes the result through functions it
# provides. Those are *imports*, so a module built with them cannot start
# anywhere that does not supply them — hence a separate feature and a separate
# module, rather than one that only Typst can instantiate.
typst = ["wasm"]

# Candidate constraint core for `W-153`. Kept explicit until its pivot and
# tie-breaking policy satisfies `D-045`; `D-050` forbids turning a successful
# compile into an adoption decision. The feature is exercised on every target
# the project ships before the current solver is migrated.
kasuari-spike = ["dep:kasuari"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"], optional = true }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"
kasuari = { version = "=0.4.12", optional = true, default-features = false }

# Only with `--features completions`, and binary-only either way.
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3.2", optional = true }

# Only with `--features png`; see the note above. `resvg` drops what a bgraph
# diagram never uses — it emits no embedded rasters and no gzipped SVG.
resvg = { version = "0.48", optional = true, default-features = false, features = [
    "text",
    "system-fonts",
] }
tiny-skia = { version = "0.12", optional = true }
