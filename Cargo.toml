[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"

[lib]
name = "bgraph"
path = "src/lib.rs"

[[bin]]
name = "bgraph"
path = "src/main.rs"

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"
