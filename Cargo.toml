[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stylable diagrams from a layout-first DSL — you place the boxes, it draws the SVG."
repository = "https://github.com/Bunchyearth23/bgraph"
readme = "README.md"
authors = ["Arnaud De Cafmeyer"]
license-file = "LICENSE"

publish = false

[lib]
name = "bgraph"
path = "src/lib.rs"

[[bin]]
name = "bgraph"
path = "src/main.rs"

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"

[features]
default = ["all-archetypes", "pdf", "json", "csv"]
all-archetypes = [
    "pie",
    "packet",
    "bytefield",
    "treemap",
    "quadrant",
    "wave",
    "sankey",
    "bar",
    "xy",
    "sequence",
    "gantt",
    "timeline",
    "block",
    "er",
    "requirements",
    "kanban",
    "journey",
    "radar",
    "rack",
    "network",
    "venn",
    "harness",
    "gitgraph",
    "orgchart",
    "mindmap",
    "treeview",
    "class",
    "state",
]
pie = []
packet = []
bytefield = []
treemap = []
quadrant = []
wave = []
sankey = []
bar = []
xy = []
sequence = []
gantt = []
timeline = []
block = []
er = []
requirements = []
kanban = []
journey = []
radar = []
rack = []
network = []
venn = []
harness = []
gitgraph = []
orgchart = []
mindmap = []
treeview = []
class = []
state = []

# PDF is vector output, so it needs no rasteriser and no dependency
# (`D-027`). On by default; switch it off and the writer is not compiled.
pdf = []

# Reading bindings from JSON. `serde_json` is already here for the language
# server's wire format, so this gates code rather than a dependency.
json = []

# Reading rows from CSV — one header line, one row per repetition. Hand-rolled
# for the same reason as everything else here: the dialect is twenty lines.
csv = []

# A native window. **Off by default, and it has to be.** This crate keeps five
# dependencies on purpose — the SVG writer, the HTTP preview and the PDF writer
# are all hand-rolled to avoid a tree — and a window plus an SVG rasteriser is
# seventy-eight more in the build graph. That is a fair price for someone who
# wants
# it and an unfair one for someone embedding the library, so it is opt-in:
#
#   cargo build --features window
window = ["dep:minifb", "dep:resvg", "dep:tiny-skia"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"

# Only with `--features window`; see the note above. `minifb` is a window and a
# pixel buffer in one crate, which is why this costs 128 packages where
# `winit` + `softbuffer` cost 249 — the windowing is the expensive half, not
# the renderer: 30 crates become 108, where `winit` + `softbuffer` would make
# them 249. `resvg` drops what a bgraph diagram never uses — it emits no
# embedded rasters and no gzipped SVG.
minifb = { version = "0.28", optional = true }
resvg = { version = "0.48", optional = true, default-features = false, features = [
    "text",
    "system-fonts",
] }
tiny-skia = { version = "0.12", optional = true }
