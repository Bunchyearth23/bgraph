[package]
name = "bgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Stylable diagrams from a layout-first DSL — you place the boxes, it draws the SVG."
repository = "https://github.com/Bunchyearth23/bgraph"
readme = "README.md"
authors = ["Arnaud De Cafmeyer"]
license-file = "LICENSE"

publish = false

[lib]
name = "bgraph"
path = "src/lib.rs"

[[bin]]
name = "bgraph"
path = "src/main.rs"

[[bin]]
name = "bgraph-lsp"
path = "src/bin/bgraph-lsp.rs"

[features]
default = ["all-archetypes"]
all-archetypes = [
    "pie",
    "packet",
    "bytefield",
    "treemap",
    "quadrant",
    "wave",
    "sankey",
    "bar",
    "xy",
    "sequence",
    "gantt",
    "timeline",
    "block",
    "er",
    "requirements",
    "kanban",
    "journey",
    "class",
    "state",
]
pie = []
packet = []
bytefield = []
treemap = []
quadrant = []
wave = []
sankey = []
bar = []
xy = []
sequence = []
gantt = []
timeline = []
block = []
er = []
requirements = []
kanban = []
journey = []
class = []
state = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
pest = "2.8.8"
pest_derive = "2.8.8"
serde_json = "1.0"
