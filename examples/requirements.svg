3" fill="#0b1120"/><text x="480.87" y="34.24" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8"><tspan x="480.87" dy="0">«refine»</tspan></text><rect x="490.36" y="95.98" width="53.49" height="18.3" rx="3" fill="#0b1120"/><text x="517.11" y="105.13" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8"><tspan x="517.11" dy="0">«satisfy»</tspan></text><rect x="723.51" y="111.4" width="46.77" height="18.3" rx="3" fill="#0b1120"/><text x="746.89" y="120.55" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8"><tspan x="746.89" dy="0">«trace»</tspan></text><rect x="0" y="0" width="405.87" height="92.55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/><rect x="-51.31" y="148.55" width="508.49" height="92.55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/><rect x="555.87" y="0" width="382.04" height="92.55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/><rect x="511.8" y="148.55" width="470.18" height="92.55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/><rect x="0" y="32.15" width="405.87" height="1.4" rx="0" fill="#38bdf8" stroke="none" stroke-width="0"/><rect x="-51.31" y="180.7" width="508.49" height="1.4" rx="0" fill="#38bdf8" stroke="none" stroke-width="0"/><rect x="555.87" y="32.15" width="382.04" height="1.4" rx="0" fill="#38bdf8" stroke="none" stroke-width="0"/><rect x="511.8" y="180.7" width="470.18" height="1.4" rx="0" fill="#38bdf8" stroke="none" stroke-width="0"/><text x="202.94" y="16.42" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Stopping distance</text><text x="14" y="50.27" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-001</text><text x="14" y="69.13" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- The vehicle shall stop within 40 m from 100 km/h on dry asphalt.</text><text x="202.94" y="164.98" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Fade resistance</text><text x="-37.31" y="198.83" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-002</text><text x="-37.31" y="217.68" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- Braking performance shall not drop by more than 10% over ten consecutive stops.</text><text x="746.89" y="16.42" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Pedal force</text><text x="569.87" y="50.27" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-003</text><text x="569.87" y="69.13" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- Full braking shall require no more than 500 N of pedal force.</text><text x="746.89" y="164.98" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Emergency assist</text><text x="525.8" y="198.83" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-004</text><text x="525.8" y="217.68" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- The assist shall command full braking within 150 ms of a detected obstacle.</text><text x="-51.31" y="-24" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">Braking system</text></g></svg>