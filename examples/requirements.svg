 within 40 m from 100 km/h on dry asphalt.</text><text x="202.94" y="171.98" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Fade resistance</text><text x="-37.31" y="198.83" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-002</text><text x="-37.31" y="217.68" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- Braking performance shall not drop by more than 10% over ten consecutive stops.</text><text x="746.89" y="23.42" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Pedal force</text><text x="569.87" y="50.27" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-003</text><text x="569.87" y="69.13" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- Full braking shall require no more than 500 N of pedal force.</text><text x="746.89" y="171.98" text-anchor="middle" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Emergency assist</text><text x="525.8" y="198.83" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- REQ-004</text><text x="525.8" y="217.68" text-anchor="start" dominant-baseline="central" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.96" font-weight="400" fill="#e2e8f0">- The assist shall command full braking within 150 ms of a detected obstacle.</text></g></svg>