site_name: bgraph — User Guide
site_description: Learn to create, preview, style and export diagrams with bgraph, starting from your first file.
docs_dir: docs/guide
site_dir: site
strict: true
theme:
  name: readthedocs
  locale: en
  highlightjs: false
  navigation_depth: 3
plugins:
  - search:
      lang: [en]
hooks:
  - docs/site_hooks.py
watch:
  - docs/reference.md
  - docs/language.md
  - docs/API.md
  - examples
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Get started:
      - Install bgraph: installation.md
      - Your first diagram: demarrage.md
      - Set up your editor: editeurs.md
  - Draw:
      - Placement and groups: placement.md
      - Styles and colors: styles.md
      - Choose a diagram type: graphiques.md
      - Gallery of all 30 types: galerie.md
  - Everyday use:
      - Commands and exports: commandes.md
      - Files, components and data: composition.md
      - Rust, browser and Typst: integrations.md
      - Troubleshooting: depannage.md
  - Reference:
      - Language manual: language.md
      - Generated property and type reference: reference.md
      - Rust API: API.md
  - Maintain this documentation: documentation.md
