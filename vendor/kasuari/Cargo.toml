[package]
name = "kasuari"
version = "0.4.12"
authors = ["Dylan Ede <dylanede@googlemail.com>", "The Ratatui Developers"]
edition = "2021"
rust-version = "1.85"
description = "A deterministic bgraph adaptation of the Kasuari Cassowary solver"
repository = "https://github.com/ratatui/kasuari"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std"]
std = ["thiserror/std", "portable-atomic?/std"]
portable-atomic = ["dep:portable-atomic", "dep:portable-atomic-util"]

[dependencies]
hashbrown = "0.16"
portable-atomic = { version = "1.13", default-features = false, features = ["require-cas"], optional = true }
portable-atomic-util = { version = "0.2.5", features = ["alloc"], optional = true }
thiserror = { version = "2.0", default-features = false }
