# The suite carries three guards that pass *silently* when the `tree-sitter`
# CLI is absent — the two grammars drifting apart, the editor queries naming a
# node type the grammar dropped, and the corpus expectations going stale. They
# say SKIPPED and exit zero, which on a developer machine is a convenience and
# in CI would be a lie. So the CLI is installed here, and a step asserts the
# guards actually ran.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native-builds:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI and language server
        run: cargo build --locked --release --bins
      - name: Build the embeddable library without default features
        run: cargo build --locked --release --no-default-features --lib

  runtime-gate:
    name: Runtime and extension parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install wasm targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: Execute native, wasm, WASI, Typst and extension fixtures
        run: ./tests/runtime/gate.sh --extensions

  feature-builds:
    name: Feature build (${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - pie
          - packet
          - bpmn
          - "packet,json,csv,pdf"
          - wasm
          - png
          - "cli,completions"
    steps:
      - uses: actions/checkout@v4

      - name: Build the selected library surface
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo build --no-default-features
          else
            cargo build --no-default-features --features "${{ matrix.features }}"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install tree-sitter
        run: cargo install tree-sitter-cli --locked || true

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Read the exit code, never grep the output for a success word: the
      # summary line of `tree-sitter test` counts parses rather than matches,
      # and `cargo test | grep 'ok'` matches the passing suites while hiding
      # the failing one. Both have already reported a broken tree as green.
      - name: Test
        run: cargo test --all-features

      - name: Performance regression guard
        run: cargo bench --bench pipeline -- --check

      - name: The grammar guards really ran
        run: |
          out=$(cargo test --all-features -- --nocapture 2>&1)
          if grep -q 'SKIPPED' <<<"$out"; then
            echo "::error::a guard skipped — tree-sitter is not on PATH, so it guarded nothing"
            grep 'SKIPPED' <<<"$out"
            exit 1
          fi

      # The examples live in `src/examples.rs` and the suite already holds them
      # to the formatter's own shape, so the step that ran `fmt --check` over a
      # directory of files went with the directory (`W-116`). What it proved —
      # that the repository's own files pass the formatter it ships — is now
      # `every_example_is_in_the_shape_the_formatter_writes`, which cannot be
      # skipped by the files not being there.

      # An archetype not compiled in must be *unknown*, not broken.
      - name: Build with no archetype at all
        run: cargo build --no-default-features
