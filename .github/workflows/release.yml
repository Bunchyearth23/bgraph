# Binaries per platform, built on a tag.
#
# "Install Rust and build it" is a barrier that keeps a tool to its author, and
# `I-025` recorded it as one. This only *builds*: nothing here pushes anything
# anywhere, because the licence question is not settled and because publishing
# is a decision this repository leaves to a person (`Q-005`, AGENTS.md).
name: release

on:
  push:
    tags: ["v*"]
  # So the artefacts can be produced and looked at without cutting a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      # One build, because there is one binary to build. There used to be two
      # — with and without a native window — and the window is gone (`W-136`):
      # `bgraph watch` opens the preview in a browser, which is on every
      # machine this runs on and needs no headers on a bare runner.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name the artefacts
        shell: bash
        run: |
          mkdir -p out
          suffix=""
          [[ "${{ matrix.os }}" == windows-latest ]] && suffix=".exe"
          for name in bgraph bgraph-lsp; do
            cp "target/${{ matrix.target }}/release/$name$suffix" \
               "out/$name-${{ matrix.target }}$suffix"
          done
          cp LICENSE out/

      - uses: actions/upload-artifact@v4
        with:
          name: bgraph-${{ matrix.target }}
          path: out/

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: ./playground/build.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: playground
      - run: pnpm build
        working-directory: playground
      - uses: actions/upload-artifact@v4
        with:
          name: bgraph-playground
          path: playground/dist
